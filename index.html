<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session monitor pill</title>
    <link rel="stylesheet" href="src/pill.css" />
    <style>
      /* The overlay window is transparent and larger than the pills so the
         expanded card and its shadow have room. Nothing here is a surface. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      body {
        position: relative;
      }
    </style>
  </head>
  <body>
    <div class="dock" id="dock"></div>
    <script type="module">
      import { start } from './src/app.js';
      start(document.getElementById('dock'));
    </script>
  </body>
</html>
