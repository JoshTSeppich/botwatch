<!DOCTYPE html>
<!-- Source for the menu bar icon. A template image: black on transparent, so
     macOS tints it for light and dark menu bars itself. -->
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  body { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
  .pill {
    width: 30px; height: 15px; border-radius: 8px;
    border: 2.5px solid #000; box-sizing: border-box;
    display: flex; align-items: center; padding-left: 3px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #000; }
</style></head>
<body><div class="pill"><div class="dot"></div></div></body></html>
