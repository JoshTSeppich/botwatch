name: release

on:
  push:
    tags: ['v*']

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          body: |
            Unsigned build. First open needs right-click → Open → Open.
            On first run the pill asks for Accessibility and Automation; see the README.
