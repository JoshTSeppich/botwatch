name: release

on:
  push:
    tags: ['v*']

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # bw-hook ships as one universal binary; npm run dist builds it first.
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm run dist
      - name: bw-hook is in the app, for both architectures
        run: |
          for app in dist/mac*/BotWatch.app; do
            lipo "$app/Contents/Resources/claude-plugin/botwatch/bin/bw-hook" -verify_arch arm64 x86_64
          done
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          body: |
            Unsigned build, so macOS refuses the first open. macOS 15 and later: System Settings →
            Privacy & Security → Open Anyway. Older macOS: right-click → Open → Open. Or:
            xattr -dr com.apple.quarantine /Applications/BotWatch.app
            On first run the pill asks for Accessibility and Automation; see the README.
